<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22%3E%3Ctext y=%22.9em%22 font-size=%2290%22%3E%F0%9F%95%AF%EF%B8%8F%3C/text%3E%3C/svg%3E" />
    <title>코티드 랜드 · 왁뿌 제국기</title>
    <script type="module" crossorigin src="./assets/index-C0AaJGzh.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/CanvasPool-UKBFKXoQ.js">
    <link rel="modulepreload" crossorigin href="./assets/canvasUtils-C4EOzQNY.js">
    <link rel="modulepreload" crossorigin href="./assets/RenderTargetSystem-BUZSMlsI.js">
    <link rel="modulepreload" crossorigin href="./assets/getTextureBatchBindGroup-BHA4o6O8.js">
    <link rel="modulepreload" crossorigin href="./assets/getTexelRangeRects-gRo1pBi3.js">
    <link rel="stylesheet" crossorigin href="./assets/index-CwCa7XgN.css">
  </head>
  <body>
    <div id="app">
      <section id="stage">
        <!-- 상단: 자원 (게임 HUD) -->
        <header id="hud">
          <div class="chip stage-chip" title="문명 단계"><span class="ic">🔥</span><b id="stage-name">말랑 무리</b></div>
          <div class="chip" id="res-wax" title="왁스: 밀랍 숲 → 코팅·원정 그물·건설"><span class="ic">🍯</span><b>0</b><small></small></div>
          <div class="chip" id="res-mat" title="자재: 자재 작업장 → 건설"><span class="ic">🧱</span><b>0</b><small></small></div>
          <div class="chip" id="res-might" title="말랑력: 주민 단계 가치의 합 (말랑이 1 · 탱탱이 2 · 쫀득이 4 · 반짝이 8 · 촛불 현자 16). 문명 승격 조건"><span class="ic">💪</span><b>0</b><small></small></div>
          <div class="chip" id="res-pop" title="주민 / 둥지 수용"><span class="ic">👥</span><b>0</b><small></small></div>
          <div class="chip" id="res-cap" title="포로 우리 · 코팅 · 굳힘 · 왁뿌 대기"><span class="ic">⛓️</span><b>0</b><small></small></div>
          <div class="chip" id="res-ter" title="정복한 영토"><span class="ic">🚩</span><b>0</b><small></small></div>
          <div class="chip bless" id="bless" hidden title="말랑이를 대양초에 바쳐 얻은 촛불 축복"></div>
        </header>
        <!-- 상단 가운데: 현재 목표 -->
        <div id="goal" class="ribbon"></div>
        <div id="alerts" aria-live="polite"></div>
        <!-- 필드 위 시설 이름표 · 시설 패널 -->
        <div id="plates"></div>
        <div id="popup" class="panel" hidden></div>
        <div id="cards" hidden></div>
        <div id="hint" class="hint" hidden></div>
        <!-- 진행 중인 원정 · 전투 결과 -->
        <div id="expcards"></div>
        <div id="battle" class="panel" hidden></div>
        <!-- 합치기 특화 고르기 -->
        <div id="spec-pick" class="panel" hidden></div>
        <!-- 원정 현황 · 기록 -->
        <div id="sheet" class="panel" hidden><div class="panel-head"><b id="sheet-title"></b><button class="x" data-act="close-sheet" aria-label="닫기">✕</button></div><div id="sheet-body"></div></div>
        <!-- 하단 독 -->
        <nav id="dock">
          <button id="btn-auto" class="dock-btn"><span class="ic">🙌</span><b>일 맡기기</b><small id="auto-count"></small></button>
          <button id="btn-map" class="dock-btn"><span class="ic">🗺️</span><b>지도</b><small>M</small></button>
          <button id="btn-exp" class="dock-btn"><span class="ic">⛺</span><b>원정</b><small id="exp-count"></small></button>
          <button id="btn-upgrade" class="dock-btn"><span class="ic">⬆️</span><b>강화</b><small id="up-count">U</small></button>
          <button id="btn-roster" class="dock-btn"><span class="ic">📋</span><b>명부</b><small>R</small></button>
          <button id="btn-log" class="dock-btn"><span class="ic">📜</span><b>기록</b><small></small></button>
          <button id="btn-settings" class="dock-btn"><span class="ic">⚙️</span><b>설정</b><small></small></button>
        </nav>
        <!-- 3D 왁뿌 마당: 필드의 왁뿌 마당 위에 겹친 투명한 3D 층 (WAKPPU_clicker의 Wax Studio 파쇄) -->
        <canvas id="yard3d"></canvas>
        <!-- 지도 -->
        <div id="map" class="overlay" hidden>
          <div class="map-frame panel">
            <div class="map-head panel-head">
              <b>🗺️ 영토 지도</b>
              <span class="legend"><i class="lg owned"></i>우리 영토 <i class="lg open"></i>원정 가능 <i class="lg locked"></i>잠김 <i class="lg hidden"></i>미발견</span>
              <button id="btn-map-close" class="x" aria-label="지도 닫기">✕</button>
            </div>
            <div class="map-body">
              <div id="map-svg"></div>
              <div id="map-card"></div>
            </div>
          </div>
        </div>
      </section>
      <div id="toasts" aria-live="polite"></div>
      <div id="modal" class="modal" hidden></div>
      <div id="debug" hidden></div>
      <div id="loading">말랑이를 깨우는 중…</div>
    </div>
  </body>
</html>
